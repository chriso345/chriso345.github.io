<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Chris Oliver</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Nunito:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                margin: 0;
                padding: 0;
                pointer-events: none;
                background: #19252b;
                /* dark-bg fallback */
            }

            div,
            a,
            img {
                position: absolute;
                box-sizing: border-box;
                -webkit-backface-visibility: hidden;
                pointer-events: none;
            }

            a {
                cursor: pointer;
                pointer-events: all;
            }

            .text {
                pointer-events: all;
                white-space: pre;
            }
        </style>
    </head>
    <script type="module" src="public/main.js"></script>

    <body></body>
</html>
